<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Giriş — Çift 40¢ Kutu</title>
<style>
  :root{--bg:#0b1020;--card:#121a2d;--text:#eef4ff;--muted:#8fa0bd;--line:#26334e;--accent:#77a7ff;--bad:#ff6b7a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#09101e,#0e1423 40%,#0b1020);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif}
  .card{background:rgba(18,26,45,.96);border:1px solid var(--line);border-radius:16px;padding:28px;width:340px;box-shadow:0 16px 48px rgba(0,0,0,.35)}
  h1{margin:0 0 4px;font-size:20px}p{margin:0 0 20px;color:var(--muted);font-size:13px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1626;color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#08122a;font-weight:800;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Çift 40¢ Kutu</h1>
  <p>Araştırma paneli — giriş gerekli</p>
  <label>Kullanıcı</label>
  <input id="user" type="text" autocomplete="username" />
  <label>Şifre</label>
  <input id="pass" type="password" autocomplete="current-password" />
  <button id="btn" type="submit">Giriş</button>
  <div class="err" id="err"></div>
</form>
<script>
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async e=>{
  e.preventDefault();$('btn').disabled=true;$('err').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:$('user').value,pass:$('pass').value})});
    const j=await r.json();
    if(j.ok){location.href='/dual40.html';return;}
    $('err').textContent=j.error||'Giriş başarısız';
  }catch(_){$('err').textContent='Bağlantı hatası';}
  $('btn').disabled=false;
});
</script>
</body>
</html>
