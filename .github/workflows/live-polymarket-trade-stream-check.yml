name: Live Polymarket Trade Stream Check

on:
  push:
    branches:
      - feature/arb-safe-first-queue-paper

permissions:
  contents: read

jobs:
  live-ws:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch current 5m token IDs from VPS
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(curl -fsS --max-time 10 'http://34.107.85.209/api/arb?tf=5m')
          UP=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upTokenId"])')
          DOWN=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downTokenId"])')
          echo "UP_TOKEN=$UP" >> "$GITHUB_ENV"
          echo "DOWN_TOKEN=$DOWN" >> "$GITHUB_ENV"
          echo "tokens acquired"
      - name: Exercise actual Go MarketTradeStream against Polymarket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cmd/ws-live-check
          cat > cmd/ws-live-check/main.go <<'EOF'
          package main

          import (
            "fmt"
            "os"
            "time"
            "pm-edge/internal/polymarket"
          )

          func main() {
            up, down := os.Getenv("UP_TOKEN"), os.Getenv("DOWN_TOKEN")
            if up == "" || down == "" { panic("missing token ids") }
            s := polymarket.NewMarketTradeStream()
            s.Start()
            defer s.Stop()
            s.SetAssets([]string{up, down})
            deadline := time.Now().Add(60*time.Second)
            seq := int64(0)
            for time.Now().Before(deadline) {
              trades, latest := s.TradesAfter(seq)
              for _, tr := range trades {
                fmt.Printf("TRADE seq=%d token=%s side=%s price=%.6f size=%.6f ts=%s\n", tr.Seq, tr.TokenID, tr.Side, tr.Price, tr.Size, tr.Timestamp.Format(time.RFC3339Nano))
                if tr.TokenID != up && tr.TokenID != down { panic("unexpected token") }
                if tr.Side != "BUY" && tr.Side != "SELL" { panic("bad side") }
                if tr.Price <= 0 || tr.Price >= 1 || tr.Size <= 0 { panic("bad trade values") }
              }
              if len(trades) > 0 {
                fmt.Printf("PASS healthy=%v gaps=%d latest=%d\n", s.Healthy(20*time.Second), s.GapCount(), latest)
                if !s.Healthy(20*time.Second) || s.GapCount() != 0 { panic("stream unhealthy or gapped") }
                return
              }
              seq = latest
              time.Sleep(500*time.Millisecond)
            }
            panic(fmt.Sprintf("no live trade within timeout healthy=%v gaps=%d lastSeq=%d", s.Healthy(20*time.Second), s.GapCount(), s.LastSeq()))
          }
          EOF
          go run ./cmd/ws-live-check
