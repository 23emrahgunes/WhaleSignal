name: One-shot multi-timeframe patch
on:
  push:
    branches:
      - feat/btc-5m-15m-gate-comparison-20260811
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btc-5m-15m-gate-comparison-20260811
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply patch
        run: python3 tools/apply_multiframe_patch.py
      - name: Format
        run: gofmt -w internal/polymarket/timeframe.go internal/storage/timeframe.go internal/paper/gates.go internal/paper/engine.go internal/storage/sqlite.go internal/storage/hedge.go internal/api/server.go internal/api/multiframe.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          rm -f tools/apply_multiframe_patch.py .github/workflows/oneshot-multiframe-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate BTC 5m and 15m experiment with gate monitors"
          git push origin HEAD:feat/btc-5m-15m-gate-comparison-20260811
