name: VPS Arb Paper Live Check

on:
  push:
    branches:
      - ops/vps-snapshot-20260811

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live VPS arb paper snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE='http://34.107.85.209'
          echo '=== HEALTH ==='
          curl -fsS --max-time 10 "$BASE/health"; echo
          echo '=== DASHBOARD MARKER ==='
          curl -fsS --max-time 10 "$BASE/" | grep -o 'Arbitraj Paper Bakiyesi' | head -1 || true
          for tf in 5m 15m; do
            echo "=== ARB LIVE $tf ==="
            curl -fsS --max-time 10 "$BASE/api/arb?tf=$tf" | tee "/tmp/arb-$tf.json"
            echo
            echo "=== ARB PAPER STATS $tf ==="
            curl -fsS --max-time 10 "$BASE/api/arb/paper/stats?tf=$tf" | tee "/tmp/stats-$tf.json"
            echo
            echo "=== ARB PAPER CYCLES $tf ==="
            curl -fsS --max-time 10 "$BASE/api/arb/paper/cycles?limit=10&tf=$tf" | tee "/tmp/cycles-$tf.json"
            echo
          done
          python3 - <<'PY'
          import json
          for tf in ('5m','15m'):
              print(f'=== SUMMARY {tf} ===')
              for kind in ('arb','stats','cycles'):
                  p=f'/tmp/{kind}-{tf}.json'
                  try:
                      d=json.load(open(p))
                  except Exception as e:
                      print(kind, 'PARSE_ERROR', e); continue
                  if kind=='arb':
                      if isinstance(d,dict):
                          print('arb_status=',d.get('status'),'reason=',d.get('reason'),'netEdge=',d.get('netEdge'),'orderSize=',d.get('orderSize'),'bookFetchMs=',d.get('bookFetchMs'),'firstLeg=',d.get('firstLeg'),'ptbReady=',d.get('ptbReady'))
                  elif kind=='stats':
                      if isinstance(d,dict):
                          keys=['cashBalance','netPaperPnl','lockedPnl','strandedPnl','totalCycles','openCycles','completedCycles','expiredNoFill','strandedTimeout','pairCompletionRate','firstLegFilledCycles','preferredFirstMatchRate','averageCompletionMs']
                          print(' '.join(f'{k}={d.get(k)}' for k in keys))
                  else:
                      if isinstance(d,list):
                          print('cycles_n=',len(d))
                          for c in d[:5]:
                              print('cycle',c.get('id'),c.get('status'),c.get('marketSlug'),c.get('preferredFirstLeg'),c.get('actualFirstLeg'),c.get('upOrderPrice'),c.get('upFillPrice'),c.get('downOrderPrice'),c.get('downFillPrice'),c.get('completionMs'),c.get('paperPnl'),c.get('reason'))
          PY
