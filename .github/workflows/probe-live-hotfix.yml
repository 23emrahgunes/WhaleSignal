name: Probe Live Deep Feed
on:
  push:
    branches:
      - fix/sqlite-deep-ready-hotfix-20260811
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public VPS
        shell: bash
        run: |
          set -x
          curl -fsS --max-time 10 'http://34.107.85.209/health' || true
          echo
          curl -fsS --max-time 10 'http://34.107.85.209/api/microstructure?tf=5m' || true
          echo
          curl -fsS --max-time 10 'http://34.107.85.209/api/live?tf=5m' || true
          echo
          curl -fsS --max-time 10 'http://34.107.85.209/api/microstructure?tf=15m' || true
