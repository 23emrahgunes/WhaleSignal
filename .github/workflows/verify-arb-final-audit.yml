name: Verify Arb Final Queue Audit

on:
  push:
    branches:
      - fix/arb-final-queue-activation-audit

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply final audit patch
        run: python3 .ops/final_arb_audit.py
      - name: Format
        run: gofmt -w internal/arb
      - name: Diff sanity
        run: git diff --check
      - name: Focused arb tests
        run: go test -count=1 ./internal/arb ./internal/polymarket ./internal/storage ./internal/api
      - name: Vet
        run: go vet ./...
      - name: Full unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -p=1 ./...
      - name: Linux build
        run: go build ./...
      - name: Audit markers
        run: |
          grep -q 'math.Abs(level.Price-price)' internal/arb/engine.go
          grep -q 'COMPLETION_WAITING_POST_ONLY_PRICE' internal/arb/paper.go
          grep -q 'TestBetterPriceTradeDoesNotConsumeOurSamePriceQueue' internal/arb/paper_test.go
          grep -q 'İlk Bacak Dolum Oranı' web/static/index.html
      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/arb/engine.go internal/arb/engine_test.go internal/arb/paper.go internal/arb/paper_test.go web/static/index.html docs/maker-arb-shadow.md
          git diff --cached --check
          git commit -m "fix: correct maker FIFO queue and completion activation"
          git push origin HEAD:${GITHUB_REF_NAME}
