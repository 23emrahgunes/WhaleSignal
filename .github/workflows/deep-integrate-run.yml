name: Deep Integration Runner

on:
  push:
    branches:
      - feat/deep-microstructure-engine-v1-20260811

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Integrate deep microstructure runtime') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deep-microstructure-engine-v1-20260811
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 .github/scripts/deep_integrate.py
      - run: gofmt -w internal/binance/microstructure.go internal/binance/microstructure_test.go internal/engine/microstructure.go internal/engine/microstructure_test.go internal/engine/evaluator.go internal/storage/microstructure.go internal/storage/microstructure_test.go internal/storage/micro_write.go internal/api/microstructure.go internal/api/server.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'Integrate deep microstructure runtime persistence and dashboard'
          git push origin HEAD:feat/deep-microstructure-engine-v1-20260811
