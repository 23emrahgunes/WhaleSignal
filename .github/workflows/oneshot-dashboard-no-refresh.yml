name: One-shot dashboard no-refresh hotfix
on:
  push:
    branches: [fix/dashboard-no-refresh-flicker-20260811]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-no-refresh-flicker-20260811
      - name: Patch dashboard polling without visual reload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/static/index.html')
          s=p.read_text()

          old="""function clearLiveWaiting(){
  ['currentPrice','priceToBeat','timeRemaining','confidence','probabilities','forecastPrice','forecast68','forecast95','forecastZ','moves','sigmaExpiry','basis','forecastSamples','microVol','floorVol','basisVol','binancePrice','imbalance','weightedImbalance','volumes','totalNotional','sideNotional','spread','bidRange','askRange','orderFlowScore'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='—'});
  document.getElementById('decision').innerHTML=chip('WAITING','warn');
  document.getElementById('depthFresh').innerHTML=chip('WAIT','neutral');
}
"""
          new="""let hasLiveSnapshot=false;
let liveBusy=false;
let slowBusy=false;
let indicatorHTML='';
let historyHTML='';
let paperHTML='';
let hedgeHTML='';
function markLiveWaiting(){
  document.getElementById('decision').innerHTML=chip('WAITING','warn');
  document.getElementById('depthFresh').innerHTML=chip('WAIT','neutral');
  if(!hasLiveSnapshot){
    document.getElementById('currentPrice').textContent='Waiting...';
    document.getElementById('priceToBeat').textContent='Waiting...';
    document.getElementById('timeRemaining').textContent='Waiting...';
  }
}
function renderIfChanged(body,html,cacheName){
  if(window[cacheName]===html)return;
  const scroller=body.closest('.scroll');
  const top=scroller?scroller.scrollTop:0;
  body.innerHTML=html;
  if(scroller)scroller.scrollTop=top;
  window[cacheName]=html;
}
"""
          if old not in s: raise SystemExit('clearLiveWaiting block not found')
          s=s.replace(old,new,1)
          s=s.replace("if(data.status){clearLiveWaiting();return}","if(data.status){markLiveWaiting();return}\n  hasLiveSnapshot=true;",1)

          old_ind="""  const box=document.getElementById('indicatorBody');box.innerHTML='';Object.entries(data.indicators||{}).sort().forEach(([name,val])=>{const cls=val>0?'up':val<0?'down':'neutral';box.insertAdjacentHTML('beforeend',`<div class=\"indrow\"><span>${name}</span>${chip(val>0?'+'+val:String(val),cls)}</div>`)});
"""
          new_ind="""  const box=document.getElementById('indicatorBody');const nextIndicatorHTML=Object.entries(data.indicators||{}).sort().map(([name,val])=>{const cls=val>0?'up':val<0?'down':'neutral';return `<div class=\"indrow\"><span>${name}</span>${chip(val>0?'+'+val:String(val),cls)}</div>`}).join('');if(nextIndicatorHTML!==indicatorHTML){box.innerHTML=nextIndicatorHTML||'<div class=\"indrow\"><span>No metrics generated</span><span class=\"chip neutral\">0</span></div>';indicatorHTML=nextIndicatorHTML;}
"""
          if old_ind not in s: raise SystemExit('indicator render block not found')
          s=s.replace(old_ind,new_ind,1)

          old_hist="""async function updateHistory(){
  const rows=await getJSON('/api/history?limit=20');const body=document.getElementById('historyBody');if(!rows||!rows.length){body.innerHTML='<tr><td colspan=\"9\">Waiting for verified signal stream...</td></tr>';return}
  body.innerHTML=rows.map(x=>`<tr><td>${timeOnly(x.timestamp)}</td><td>${usd(x.currentPrice)}</td><td>${usd(x.priceToBeat)}</td><td>${pct(x.pUp)}</td><td>${pct(x.pDown)}</td><td>${Number(x.ptbZ||0).toFixed(2)}σ</td><td>${pct(x.orderFlowScore)}</td><td>${decisionChip(x.decision)}</td><td>${pctDirect(x.confidence,1)}</td></tr>`).join('');
}
"""
          new_hist="""async function updateHistory(){
  const rows=await getJSON('/api/history?limit=20');const body=document.getElementById('historyBody');const html=(!rows||!rows.length)?'<tr><td colspan=\"9\">Waiting for verified signal stream...</td></tr>':rows.map(x=>`<tr><td>${timeOnly(x.timestamp)}</td><td>${usd(x.currentPrice)}</td><td>${usd(x.priceToBeat)}</td><td>${pct(x.pUp)}</td><td>${pct(x.pDown)}</td><td>${Number(x.ptbZ||0).toFixed(2)}σ</td><td>${pct(x.orderFlowScore)}</td><td>${decisionChip(x.decision)}</td><td>${pctDirect(x.confidence,1)}</td></tr>`).join('');
  if(html!==historyHTML){const scroller=body.closest('.scroll');const top=scroller?scroller.scrollTop:0;body.innerHTML=html;if(scroller)scroller.scrollTop=top;historyHTML=html;}
}
"""
          if old_hist not in s: raise SystemExit('history block not found')
          s=s.replace(old_hist,new_hist,1)

          s=s.replace("const body=document.getElementById('paperTradeBody');if(!trades||!trades.length){body.innerHTML='<tr><td colspan=\"9\">Henüz eşik koşullarını geçen paper trade yok.</td></tr>';return}body.innerHTML=trades.map(t=>{const status=t.status==='OPEN'?chip('OPEN','open'):t.won?chip('WIN','win'):chip('LOSS','loss');return `<tr><td>${timeOnly(t.entryTime)}</td><td>${t.marketSlug.replace('btc-updown-5m-','')}</td><td>${decisionChip(t.side)}</td><td>${Number(t.entryPrice).toFixed(3)}</td><td>${usd(t.stake)}</td><td>${pctDirect(t.entryConfidence,1)}</td><td>${status}</td><td>${t.outcome||'—'}</td><td class=\"${signClass(t.pnl)}\">${t.status==='OPEN'?'—':usd(t.pnl)}</td></tr>`}).join('');",
          "const body=document.getElementById('paperTradeBody');const html=(!trades||!trades.length)?'<tr><td colspan=\"9\">Henüz eşik koşullarını geçen paper trade yok.</td></tr>':trades.map(t=>{const status=t.status==='OPEN'?chip('OPEN','open'):t.won?chip('WIN','win'):chip('LOSS','loss');return `<tr><td>${timeOnly(t.entryTime)}</td><td>${t.marketSlug.replace('btc-updown-5m-','')}</td><td>${decisionChip(t.side)}</td><td>${Number(t.entryPrice).toFixed(3)}</td><td>${usd(t.stake)}</td><td>${pctDirect(t.entryConfidence,1)}</td><td>${status}</td><td>${t.outcome||'—'}</td><td class=\"${signClass(t.pnl)}\">${t.status==='OPEN'?'—':usd(t.pnl)}</td></tr>`}).join('');if(html!==paperHTML){const scroller=body.closest('.scroll');const top=scroller?scroller.scrollTop:0;body.innerHTML=html;if(scroller)scroller.scrollTop=top;paperHTML=html;}",1)

          s=s.replace("const body=document.getElementById('hedgeBody');if(!rows||!rows.length){body.innerHTML='<tr><td colspan=\"14\">Henüz persistent reverse hedge yok.</td></tr>';return}body.innerHTML=rows.map(h=>`<tr><td>${timeOnly(h.hedgeTime)}</td><td>${h.marketSlug.replace('btc-updown-5m-','')}</td><td>${decisionChip(h.originalSide)}</td><td>${decisionChip(h.side)}</td><td>${Number(h.entryPrice).toFixed(3)}</td><td>${Number(h.shares).toFixed(3)}</td><td>${pct(h.reverseProbability)}</td><td>${pct(h.edge)}</td><td>${pct(h.persistence)}</td><td>${Number(h.smoothedScore).toFixed(3)}</td><td>${Number(h.ptbZ).toFixed(2)}σ</td><td class=\"${signClass(h.lockedPnl)}\">${usd(h.lockedPnl)}</td><td>${h.status==='OPEN'?chip('OPEN','open'):chip('SETTLED','neutral')}</td><td class=\"${signClass(h.combinedPnl)}\">${h.status==='OPEN'?'—':usd(h.combinedPnl)}</td></tr>`).join('');",
          "const body=document.getElementById('hedgeBody');const html=(!rows||!rows.length)?'<tr><td colspan=\"14\">Henüz persistent reverse hedge yok.</td></tr>':rows.map(h=>`<tr><td>${timeOnly(h.hedgeTime)}</td><td>${h.marketSlug.replace('btc-updown-5m-','')}</td><td>${decisionChip(h.originalSide)}</td><td>${decisionChip(h.side)}</td><td>${Number(h.entryPrice).toFixed(3)}</td><td>${Number(h.shares).toFixed(3)}</td><td>${pct(h.reverseProbability)}</td><td>${pct(h.edge)}</td><td>${pct(h.persistence)}</td><td>${Number(h.smoothedScore).toFixed(3)}</td><td>${Number(h.ptbZ).toFixed(2)}σ</td><td class=\"${signClass(h.lockedPnl)}\">${usd(h.lockedPnl)}</td><td>${h.status==='OPEN'?chip('OPEN','open'):chip('SETTLED','neutral')}</td><td class=\"${signClass(h.combinedPnl)}\">${h.status==='OPEN'?'—':usd(h.combinedPnl)}</td></tr>`).join('');if(html!==hedgeHTML){const scroller=body.closest('.scroll');const top=scroller?scroller.scrollTop:0;body.innerHTML=html;if(scroller)scroller.scrollTop=top;hedgeHTML=html;}",1)

          old_tick="""async function tick(){try{await Promise.all([updateLive(),updateHistory(),updatePaper(),updateHedge()]);setConnection(true)}catch(e){console.error(e);setConnection(false)}}
setInterval(tick,1000);tick();
"""
          new_tick="""async function tickLive(){if(liveBusy)return;liveBusy=true;try{await updateLive();setConnection(true)}catch(e){console.error(e);setConnection(false)}finally{liveBusy=false}}
async function tickSlow(){if(slowBusy)return;slowBusy=true;try{await Promise.all([updateHistory(),updatePaper(),updateHedge()])}catch(e){console.error(e)}finally{slowBusy=false}}
setInterval(tickLive,1000);
setInterval(tickSlow,5000);
tickLive();tickSlow();
"""
          if old_tick not in s: raise SystemExit('tick block not found')
          s=s.replace(old_tick,new_tick,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/oneshot-dashboard-no-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/static/index.html .github/workflows/oneshot-dashboard-no-refresh.yml
          git commit -m "fix: stop dashboard refresh flicker and polling overlap"
          git push origin HEAD:fix/dashboard-no-refresh-flicker-20260811
