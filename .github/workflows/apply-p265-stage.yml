name: Stage Validated P2.6.5 Source

on:
  pull_request:
    branches:
      - direction-engine
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'direction-engine-p265-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direction-engine-p265-stage
          fetch-depth: 0
      - name: Decode, apply and fully validate source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(.p265-patch/part-*)
          if (( ${#parts[@]} != 13 )); then
            echo "Expected 13 patch parts, found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" > /tmp/p265.patch.xz.b64
          base64 -d /tmp/p265.patch.xz.b64 > /tmp/p265.patch.xz
          sha256sum /tmp/p265.patch.xz
          xz -dc /tmp/p265.patch.xz > /tmp/p265.patch
          sha256sum /tmp/p265.patch
          echo "fb39a86d8415b51cc6245e193c20278020ccf5e69ad5a1f210e948011e709034  /tmp/p265.patch" | sha256sum -c -
          git apply --check /tmp/p265.patch
          git apply /tmp/p265.patch
          rm -rf .p265-patch .github/workflows/export-source.yml
          python3 -m venv .venv
          ./.venv/bin/pip install -q --upgrade pip
          ./.venv/bin/pip install -q -r requirements.txt
          ./.venv/bin/python -m py_compile ./*.py reference/*.py
          ./.venv/bin/python -m compileall -q .
          bash -n deploy_p26.sh scripts/harden_port_8091.sh scripts/rollback_port_8091.sh scripts/status_p26.sh scripts/stop_p26.sh scripts/smoke_p26.sh
          PHASE=P1 MODEL_TRAINING_ENABLED=false CALIBRATION_ENABLED=false PAPER_TRADING_ENABLED=false ./.venv/bin/python -m pytest -q
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete P2.6.5 hardening and disabled Paper V2 runtime"
          git push origin HEAD:direction-engine-p265-stage
      - name: Remove temporary staging workflow from target branch
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin direction-engine
          git switch -C p265-workflow-cleanup origin/direction-engine
          git rm .github/workflows/apply-p265-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary P2.6.5 staging workflow"
          git push origin HEAD:direction-engine
