name: One-shot gofmt hedge

on:
  push:
    branches:
      - feat/regime-hedge-clob-paper-execution-20260811

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/regime-hedge-clob-paper-execution-20260811
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go tree and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -w
          rm -f .github/workflows/oneshot-gofmt-hedge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: gofmt forecast and hedge changes"
          git push origin HEAD:feat/regime-hedge-clob-paper-execution-20260811
