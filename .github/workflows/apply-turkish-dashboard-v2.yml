name: Apply Turkish Dashboard V2
on:
  push:
    branches:
      - feature/turkish-dashboard-20260811-v2
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply Turkish dashboard v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/turkish-dashboard-20260811-v2
      - run: python3 .github/scripts/turkish_dashboard_v2.py
      - name: Commit translated dashboard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/static/index.html
          git commit -m 'Apply Turkish dashboard v2'
          git push origin HEAD:feature/turkish-dashboard-20260811-v2
