name: Apply P2.6.5 Hardening Patch

on:
  push:
    branches:
      - direction-engine-p265-stage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direction-engine-p265-stage
          fetch-depth: 0
      - name: Decode, verify and apply validated patch
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(.p265-patch/part-*)
          if (( ${#parts[@]} != 13 )); then
            echo "Expected 13 patch parts, found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" > /tmp/p265.patch.xz.b64
          echo "ad8e40224c2fe09ba9820c20fd3afaf800175b60290467173e380b4aa92aadd2  /tmp/p265.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/p265.patch.xz.b64 > /tmp/p265.patch.xz
          echo "ef2b301c8790892f903d9c3b261e644c0ff68982fc43e2563340f210b91820d3  /tmp/p265.patch.xz" | sha256sum -c -
          xz -dc /tmp/p265.patch.xz > /tmp/p265.patch
          echo "fb39a86d8415b51cc6245e193c20278020ccf5e69ad5a1f210e948011e709034  /tmp/p265.patch" | sha256sum -c -
          git apply --check /tmp/p265.patch
          git apply --index /tmp/p265.patch
          git rm -r .p265-patch .github/workflows/export-source.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete P2.6.5 hardening and disabled Paper V2 runtime"
          git push origin HEAD:direction-engine-p265-stage
