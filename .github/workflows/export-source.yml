name: Export Source Snapshot

on:
  push:
    branches:
      - direction-engine-p265-hardening

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source archive
        run: |
          git status --short
          tar --exclude=.git -czf direction-engine-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: direction-engine-source
          path: direction-engine-source.tar.gz
          if-no-files-found: error
          retention-days: 1
