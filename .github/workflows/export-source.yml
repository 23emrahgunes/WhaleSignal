name: Apply P2.6.5 Hardening Patch

on:
  push:
    branches:
      - direction-engine-p265-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direction-engine-p265-hardening
          fetch-depth: 0
      - name: Apply validated local patch and remove bootstrap files
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f .p265-hardening.patch ]]; then
            echo "Patch not present yet; bootstrap workflow is ready."
            exit 0
          fi
          git apply --check .p265-hardening.patch
          git apply --index .p265-hardening.patch
          git rm .p265-hardening.patch .github/workflows/export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete P2.6.5 hardening and disabled Paper V2 runtime"
          git push origin HEAD:direction-engine-p265-hardening
