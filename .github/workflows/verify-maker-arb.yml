name: Verify Maker Arb Shadow Engine

on:
  push:
    branches:
      - feature/maker-arb-shadow-engine

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply implementation
        run: |
          python3 .ops/apply_maker_arb.py
          python3 .ops/fix_maker_arb_validation.py
      - name: Format
        run: gofmt -w internal/arb internal/storage/arb.go internal/storage/arb_test.go internal/api/arb.go internal/api/arb_test.go internal/polymarket/clob.go internal/polymarket/book_snapshot_test.go internal/config/config.go cmd/pm-edge/arb_shadow.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go
      - name: Diff sanity
        run: git diff --check
      - name: Focused tests
        run: go test -count=1 ./internal/arb ./internal/polymarket ./internal/storage ./internal/api
      - name: Vet
        run: go vet ./...
      - name: Full unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -p=1 ./...
      - name: Linux build
        run: go build ./...
      - name: Dashboard smoke markers
        run: |
          grep -q 'Maker Arbitraj — Ters Bacak Risk Motoru' web/static/index.html
          grep -q '/api/arb?tf=' web/static/index.html
          grep -q 'ARB_SHADOW_ENABLED=true' .env.example
      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+23emrahgunes@users.noreply.github.com"
          git add .env.example docs/maker-arb-shadow.md internal/arb internal/storage/arb.go internal/storage/arb_test.go internal/api/arb.go internal/api/arb_test.go internal/polymarket/clob.go internal/polymarket/book_snapshot_test.go internal/config/config.go internal/api/server.go web/static/index.html
          git add -f cmd/pm-edge/arb_shadow.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go
          git diff --cached --check
          git commit -m "feat: add maker arbitrage shadow and leg-risk engine"
          git push origin HEAD:${GITHUB_REF_NAME}
