name: Verify PTB Terminal Patch

on:
  push:
    branches:
      - feature/ptb-terminal-micro-probability

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: |
          python3 .ops/apply_ptb_terminal_patch.py
          python3 .ops/fix_ptb_terminal_patch.py
      - name: Format and verify
        run: |
          gofmt -w internal/binance/microstructure.go internal/binance/microstructure_test.go internal/engine/evaluator.go internal/engine/ptb_terminal_probability.go internal/engine/ptb_terminal_probability_test.go internal/storage/microstructure.go internal/storage/microstructure_test.go
          go test ./internal/binance ./internal/engine ./internal/storage
          go vet ./...
      - name: Commit only verified product files and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/binance/microstructure.go internal/binance/microstructure_test.go internal/engine/evaluator.go internal/engine/ptb_terminal_probability.go internal/engine/ptb_terminal_probability_test.go internal/storage/microstructure.go internal/storage/microstructure_test.go web/static/index.html
          git rm -f .ops/apply_ptb_terminal_patch.py .ops/fix_ptb_terminal_patch.py .github/workflows/verify-ptb-terminal-patch.yml
          git commit -m 'feat: add PTB terminal microstructure probability'
          git push origin HEAD:feature/ptb-terminal-micro-probability
