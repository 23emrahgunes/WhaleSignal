name: Apply PTB Economic Entry Gate

on:
  push:
    branches:
      - feature/ptb-economic-entry-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply hard-gate patch
        run: |
          python3 .ops/apply_ptb_economic_gate.py
          python3 .ops/fix_ptb_economic_gate_tests.py
      - name: Format and full verify
        run: |
          gofmt -w internal/config/config.go internal/paper/engine.go internal/paper/gates.go internal/paper/engine_test.go internal/paper/hedge_test.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go
          files="$(gofmt -l .)"; test -z "$files" || { echo "$files"; exit 1; }
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/pm-edge-linux-amd64 ./cmd/pm-edge
      - name: Commit verified product files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example internal/config/config.go internal/paper/engine.go internal/paper/gates.go internal/paper/engine_test.go internal/paper/hedge_test.go cmd/pm-edge/main.go cmd/pm-edge/runtime15.go web/static/index.html
          git rm -f .ops/apply_ptb_economic_gate.py .ops/fix_ptb_economic_gate_tests.py .github/workflows/apply-ptb-economic-gate.yml
          git commit -m 'feat: enforce PTB economic paper entry gate'
          git push origin HEAD:feature/ptb-economic-entry-gate
