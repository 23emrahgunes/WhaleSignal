name: One-shot dashboard newline fix
on:
  push:
    branches:
      - fix/dashboard-no-refresh-flicker-20260811
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-no-refresh-flicker-20260811
      - name: Fix dashboard JS newline
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          rm -f .github/workflows/oneshot-dashboard-newline-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/static/index.html .github/workflows/oneshot-dashboard-newline-fix.yml
          git commit -m "fix: repair dashboard waiting-state javascript"
          git push origin HEAD:fix/dashboard-no-refresh-flicker-20260811
