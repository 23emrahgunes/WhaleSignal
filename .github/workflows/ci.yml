name: PM-Edge CI

on:
  push:
    branches:
      - main
      - feature/tv-direction-paper-engine-1868605833685460026
      - fix/tv-direction-production-ready-20260810
  pull_request:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply gofmt
        run: gofmt -w .

      - name: Commit formatting once
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git add internal/paper internal/binance/depth_fallback_test.go internal/chainlink/boundary_test.go internal/api/paper_test.go 2>/dev/null || true
            git commit -m "style: gofmt paper engine and depth fallback"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Verify deployment shell syntax
        run: bash -n deploy.sh healthcheck.sh backup.sh update.sh install.sh

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/pm-edge-linux-amd64 ./cmd/pm-edge
          chmod +x dist/pm-edge-linux-amd64
          sha256sum dist/pm-edge-linux-amd64 > dist/pm-edge-linux-amd64.sha256

      - name: Runtime health and paper API smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT=18080 DB_PATH="$RUNNER_TEMP/pm-edge-smoke.sqlite" LOG_LEVEL=error \
            ./dist/pm-edge-linux-amd64 tv-direction --mock >"$RUNNER_TEMP/pm-edge-smoke.log" 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 15); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "pm-edge exited during smoke test"
              cat "$RUNNER_TEMP/pm-edge-smoke.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "health endpoint did not become ready"
            cat "$RUNNER_TEMP/pm-edge-smoke.log"
            exit 1
          fi
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/live >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/paper/stats >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18080/api/paper/trades?limit=5' >/dev/null

      - name: Upload VPS binary
        uses: actions/upload-artifact@v4
        with:
          name: pm-edge-linux-amd64
          path: |
            dist/pm-edge-linux-amd64
            dist/pm-edge-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 30
