name: PM-Edge CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Go version
        run: go version

      - name: Canonicalize Go formatting
        run: gofmt -w cmd internal

      - name: Format verification
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          test -z "$UNFORMATTED" || { echo "$UNFORMATTED"; exit 1; }

      - name: Deployment script syntax
        shell: bash
        run: |
          bash -n deploy.sh
          bash -n healthcheck.sh
          bash -n backup.sh
          bash -n update.sh
          bash -n install.sh

      - name: Module tidy gate
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -p=1 ./...

      - name: Race tests
        run: go test -race -count=1 -p=1 ./...

      - name: Build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/pm-edge ./cmd/pm-edge
          chmod +x dist/pm-edge
          ls -lh dist/pm-edge

      - name: Runtime startup smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/pm-edge-smoke.sqlite /tmp/pm-edge-smoke.log
          PORT=18080 DB_PATH=/tmp/pm-edge-smoke.sqlite POLYMARKET_POLL_SEC=5 LOG_LEVEL=info \
            ./dist/pm-edge tv-direction > /tmp/pm-edge-smoke.log 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "pm-edge exited during smoke test"
              cat /tmp/pm-edge-smoke.log
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health | grep -q 'OK'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "health endpoint did not become ready"
            cat /tmp/pm-edge-smoke.log
            exit 1
          fi

          curl -fsS --max-time 2 http://127.0.0.1:18080/api/live >/tmp/pm-edge-live.json
          test -s /tmp/pm-edge-live.json
          echo "Runtime smoke passed"
          tail -n 30 /tmp/pm-edge-smoke.log || true

      - name: VPS deploy script smoke
        shell: bash
        run: |
          set -euo pipefail
          cp dist/pm-edge pm-edge
          chmod +x pm-edge deploy.sh
          rm -f /tmp/pm-edge-deploy.sqlite

          cleanup_deploy() {
            if [ -f pm-edge.pid ]; then
              PID="$(cat pm-edge.pid)"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
          }
          trap cleanup_deploy EXIT

          PORT=18081 DB_PATH=/tmp/pm-edge-deploy.sqlite POLYMARKET_POLL_SEC=5 LOG_LEVEL=info ./deploy.sh
          curl -fsS --max-time 2 http://127.0.0.1:18081/health | grep -q 'OK'
          kill -0 "$(cat pm-edge.pid)"
          echo "VPS deploy script smoke passed"

      - name: Upload linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-edge-linux-amd64
          path: dist/pm-edge
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified formatting and VPS binary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        shell: bash
        run: |
          cp dist/pm-edge pm-edge
          chmod +x pm-edge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal pm-edge
          if git diff --cached --quiet; then
            echo "Verified source and binary are already current."
            exit 0
          fi
          git commit -m "build: publish verified Go source and linux binary [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
