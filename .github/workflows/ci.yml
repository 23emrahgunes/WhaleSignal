name: PM-Edge CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Go version
        run: go version

      - name: Format gate
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Module tidy gate
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -p=1 ./...

      - name: Race tests
        run: go test -race -count=1 -p=1 ./...

      - name: Build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/pm-edge ./cmd/pm-edge
          chmod +x dist/pm-edge
          ls -lh dist/pm-edge

      - name: Upload linux binary
        uses: actions/upload-artifact@v4
        with:
          name: pm-edge-linux-amd64
          path: dist/pm-edge
          if-no-files-found: error
          retention-days: 14
