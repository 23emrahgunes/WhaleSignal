name: PM-Edge CI

on:
  push:
    branches:
      - main
      - feature/tv-direction-paper-engine-1868605833685460026
      - fix/tv-direction-production-ready-20260810
      - fix/github-vps-autodeploy-20260811
  pull_request:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Verify deployment shell syntax
        run: bash -n deploy.sh healthcheck.sh backup.sh update.sh install.sh

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/pm-edge-linux-amd64 ./cmd/pm-edge
          chmod +x dist/pm-edge-linux-amd64
          (cd dist && sha256sum pm-edge-linux-amd64 > pm-edge-linux-amd64.sha256)

      - name: Runtime health and paper API smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT=18080 DB_PATH="$RUNNER_TEMP/pm-edge-smoke.sqlite" LOG_LEVEL=error \
            ./dist/pm-edge-linux-amd64 tv-direction --mock >"$RUNNER_TEMP/pm-edge-smoke.log" 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 15); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "pm-edge exited during smoke test"
              cat "$RUNNER_TEMP/pm-edge-smoke.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "health endpoint did not become ready"
            cat "$RUNNER_TEMP/pm-edge-smoke.log"
            exit 1
          fi
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/live >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/paper/stats >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18080/api/paper/trades?limit=5' >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/paper/hedge/stats >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18080/api/paper/hedges?limit=5' >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18080/api/microstructure?tf=5m' >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18080/api/microstructure/history?tf=5m&limit=5' >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/ | grep -q 'Binance Deep Microstructure'

      - name: Deployment script smoke test with prebuilt
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT=18081 \
          DB_PATH="$RUNNER_TEMP/pm-edge-deploy-smoke.sqlite" \
          PM_EDGE_PREBUILT="$GITHUB_WORKSPACE/dist/pm-edge-linux-amd64" \
          ./deploy.sh
          curl --fail --silent --max-time 2 http://127.0.0.1:18081/health >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18081/api/paper/stats >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:18081/api/paper/hedge/stats >/dev/null
          curl --fail --silent --max-time 2 'http://127.0.0.1:18081/api/microstructure?tf=5m' >/dev/null
          pid="$(cat logs/pm-edge.pid)"
          kill -TERM "$pid" 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          kill -9 "$pid" 2>/dev/null || true

      - name: Upload VPS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-edge-linux-amd64
          path: |
            dist/pm-edge-linux-amd64
            dist/pm-edge-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish vps-latest public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git tag -f vps-latest "$GITHUB_SHA"
          git push origin refs/tags/vps-latest --force
          if gh release view vps-latest >/dev/null 2>&1; then
            gh release upload vps-latest \
              dist/pm-edge-linux-amd64 \
              dist/pm-edge-linux-amd64.sha256 \
              --clobber
            gh release edit vps-latest \
              --title "PM-Edge VPS Latest" \
              --notes "CI-verified Linux amd64 binary for commit $GITHUB_SHA. Paper-only research engine."
          else
            gh release create vps-latest \
              dist/pm-edge-linux-amd64 \
              dist/pm-edge-linux-amd64.sha256 \
              --target "$GITHUB_SHA" \
              --title "PM-Edge VPS Latest" \
              --notes "CI-verified Linux amd64 binary for commit $GITHUB_SHA. Paper-only research engine." \
              --latest=false
          fi

      - name: Verify public vps-latest download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://github.com/23emrahgunes/WhaleSignal/releases/download/vps-latest"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/pm-edge-release" "$base/pm-edge-linux-amd64"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/pm-edge-release.sha256" "$base/pm-edge-linux-amd64.sha256"
          expected="$(awk 'NR==1 {print $1}' "$RUNNER_TEMP/pm-edge-release.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/pm-edge-release" | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          test "$(od -An -tx1 -N4 "$RUNNER_TEMP/pm-edge-release" | tr -d ' \n')" = "7f454c46"
