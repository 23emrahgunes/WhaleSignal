name: Verify authoritative aggTrade fix

on:
  push:
    branches:
      - fix/aggtrade-rest-authoritative-20260812

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'ops: cleanup aggTrade verification')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply product patch
        run: python3 .ops/apply_aggtrade_rest_authoritative.py

      - name: Format
        run: gofmt -w internal/binance/microstructure.go internal/binance/microstructure_test.go

      - name: Focused tests
        run: go test -count=1 ./internal/binance ./internal/engine

      - name: Vet
        run: go vet ./...

      - name: Full unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -p=1 ./...

      - name: Linux build
        run: go build ./...

      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/binance/microstructure.go internal/binance/microstructure_test.go
          git diff --cached --check
          git commit -m "fix: make Binance aggTrades REST authoritative"
          git push origin HEAD:${GITHUB_REF_NAME}
