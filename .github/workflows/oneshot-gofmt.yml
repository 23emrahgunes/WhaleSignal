name: One-shot gofmt

on:
  push:
    branches:
      - fix/forecast-volatility-basis-calibration-20260811

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forecast-volatility-basis-calibration-20260811
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          gofmt -w internal/engine/evaluator.go internal/engine/forecast_uncertainty.go internal/probability/model.go internal/probability/model_test.go
          rm -f .github/workflows/oneshot-gofmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: gofmt forecast calibration changes"
          git push origin HEAD:fix/forecast-volatility-basis-calibration-20260811
