name: Direction Engine Tests

on:
  push:
    branches: [direction-engine]
  pull_request:
    branches: [direction-engine]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile *.py reference/*.py

      - name: Test
        env:
          PHASE: P1
          MODEL_TRAINING_ENABLED: 'false'
          CALIBRATION_ENABLED: 'false'
        run: pytest -q

  live-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install core and pinned LIVE SDKs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-live.txt

      - name: Verify official SDK surface used by P3 LIVE
        run: |
          python - <<'PY'
          import inspect
          from py_clob_client_v2 import (
              AssetType,
              BalanceAllowanceParams,
              ClobClient,
              MarketOrderArgs,
              OrderArgs,
              OrderType,
              PostOrdersV2Args,
              Side,
          )
          from polymarket.clients.secure import SecureClient

          required = (
              "create_or_derive_api_key",
              "get_balance_allowance",
              "update_balance_allowance",
              "get_order_book",
              "create_order",
              "post_orders",
              "create_and_post_market_order",
          )
          for name in required:
              assert hasattr(ClobClient, name), name
          assert hasattr(SecureClient, "create")
          assert hasattr(SecureClient, "merge_positions")
          assert hasattr(OrderType, "FOK")
          assert hasattr(Side, "BUY") and hasattr(Side, "SELL")
          assert AssetType.COLLATERAL is not None and AssetType.CONDITIONAL is not None
          assert "condition_id" in inspect.signature(SecureClient.merge_positions).parameters
          assert "amount" in inspect.signature(SecureClient.merge_positions).parameters
          print("P3_LIVE_SDK_CONTRACT_PASS")
          PY

      - name: Compile LIVE modules
        run: python -m py_compile p3_live_*.py p3_daemon.py p3_web.py

      - name: Run guarded LIVE deterministic tests
        env:
          PHASE: P1
          MODEL_TRAINING_ENABLED: 'false'
          CALIBRATION_ENABLED: 'false'
        run: pytest -q test_p3_live_guard.py test_p3_live_executor.py test_p3_panel_tr.py
