name: Direction Engine Tests

on:
  push:
    branches: [direction-engine]
  pull_request:
    branches: [direction-engine]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile *.py reference/*.py

      - name: Test
        env:
          PHASE: P1
          MODEL_TRAINING_ENABLED: 'false'
          CALIBRATION_ENABLED: 'false'
        run: pytest -q
