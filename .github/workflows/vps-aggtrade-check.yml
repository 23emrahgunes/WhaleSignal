name: VPS AggTrade Check

on:
  push:
    branches:
      - ops/vps-snapshot-20260811

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live diagnostics
        shell: python
        run: |
          import json, urllib.request
          VPS='http://34.107.85.209'
          def get(url):
              with urllib.request.urlopen(url, timeout=20) as r:
                  return json.load(r)
          def text(url):
              with urllib.request.urlopen(url, timeout=20) as r:
                  return r.read().decode().strip()
          print('HEALTH', text(VPS+'/health'))
          for tf in ('5m','15m'):
              live=get(f'{VPS}/api/microstructure?tf={tf}')
              gates=get(f'{VPS}/api/gates?tf={tf}')
              print('LIVE',tf,json.dumps(live,sort_keys=True))
              print('GATES',tf,json.dumps(gates,sort_keys=True))
