name: VPS AggTrade Check

on:
  push:
    branches:
      - ops/vps-snapshot-20260811

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare Binance REST sources
        shell: python
        run: |
          import json, urllib.request
          from datetime import datetime, timezone

          VPS='http://34.107.85.209'
          BASES=['https://api.binance.com','https://api-gcp.binance.com','https://data-api.binance.vision']

          def get(url):
              with urllib.request.urlopen(url, timeout=20) as r:
                  return json.load(r)

          def parse_ts(s):
              if s.endswith('Z'): s=s[:-1]+'+00:00'
              return datetime.fromisoformat(s).astimezone(timezone.utc)

          hist=get(VPS+'/api/microstructure/history?tf=5m&limit=1')
          row=hist[0] if isinstance(hist,list) else hist
          end_ms=int(parse_ts(row['timestamp']).timestamp()*1000)
          start_ms=end_ms-60000
          print('VPS_ROW', json.dumps({k:row.get(k) for k in ['timestamp','trade60BuyUsd','trade60SellUsd','trade60Imbalance']},sort_keys=True))

          for base in BASES:
              try:
                  rows=get(f'{base}/api/v3/aggTrades?symbol=BTCUSDT&startTime={start_ms}&endTime={end_ms}&limit=1000')
                  buy=sell=0.0; bn=sn=0; mtrue=mfalse=0
                  for x in rows:
                      n=float(x['p'])*float(x['q'])
                      if x.get('m') is True:
                          sell+=n; sn+=1; mtrue+=1
                      elif x.get('m') is False:
                          buy+=n; bn+=1; mfalse+=1
                  print('SOURCE', base, json.dumps({'rows':len(rows),'mTrue':mtrue,'mFalse':mfalse,'buyUsd':buy,'sellUsd':sell,'buyN':bn,'sellN':sn},sort_keys=True))
                  print('SAMPLE', base, json.dumps(rows[:5],sort_keys=True))
              except Exception as e:
                  print('SOURCE_ERROR', base, repr(e))
