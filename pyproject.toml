[project]
name = "dual-arbitraj"
version = "0.1.0"
description = "Polymarket ikili opsiyon cift-40c market-making + mean-reversion botu (asyncio)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
